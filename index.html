<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linguo Electro | Language Wing Election - Al Falah</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            purple: '#7c3aed',
                            pink: '#db2777',
                            surface: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #0f0c29;
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .hidden-section { display: none; }
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        #loader-overlay {
            background-image: linear-gradient(rgba(124, 58, 237, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(124, 58, 237, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 300px; } }
    </style>
</head>
<body class="antialiased selection:bg-brand-pink selection:text-white">

    <nav id="navbar" class="fixed top-0 w-full z-50 glass-panel border-b border-white/10 hidden-section">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2 cursor-pointer" onclick="app.navigate('intro')">
                    <i class="fa-solid fa-bolt text-yellow-400 text-2xl"></i>
                    <span class="font-bold text-xl tracking-wider uppercase">Linguo<span class="text-yellow-400">Electro</span></span>
                </div>
                <div class="flex space-x-4">
                    <button onclick="app.navigate('intro')" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/10 transition-colors">Home</button>
                    <button onclick="app.navigate('pre-results')" class="px-3 py-2 rounded-md text-sm font-medium bg-brand-purple hover:bg-brand-purple/80 transition-all">Analytics</button>
                    <button onclick="app.logout()" class="px-3 py-2 rounded-md text-sm font-medium hover:text-red-400 transition-colors"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <div class="relative min-h-screen flex items-center justify-center p-4 pt-20">
        <!-- 1. LOGIN -->
        <section id="page-login" class="w-full max-w-md fade-in">
            <div class="glass-panel p-8 rounded-2xl text-center">
                <i class="fa-solid fa-lock text-4xl text-brand-pink mb-6"></i>
                <h1 class="text-3xl font-bold mb-8">Admin Access</h1>
                <form onsubmit="app.handleLogin(event)" class="space-y-4">
                    <input type="text" id="username" placeholder="Username" class="w-full bg-black/20 border border-white/10 rounded-lg py-3 px-4 outline-none text-white">
                    <input type="password" id="password" placeholder="Password" class="w-full bg-black/20 border border-white/10 rounded-lg py-3 px-4 outline-none text-white">
                    <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-3 rounded-lg font-bold">Access Console</button>
                    <p id="login-error" class="text-red-400 text-xs hidden">Access Denied</p>
                </form>
            </div>
        </section>

        <!-- 2. INTRO -->
        <section id="page-intro" class="w-full max-w-4xl text-center hidden-section fade-in">
            <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500">
                LINGUO ELECTRO
            </h1>
            <div class="flex flex-col sm:flex-row justify-center gap-6 mt-12">
                <button onclick="app.navigate('voter-details')" class="px-10 py-5 bg-white text-black font-extrabold text-xl rounded-2xl">CAST YOUR VOTE</button>
                <button onclick="app.navigate('pre-results')" class="px-10 py-5 glass-panel text-white font-bold text-xl rounded-2xl">ANALYTICS</button>
            </div>
        </section>

        <!-- 3. VOTER ID -->
        <section id="page-voter-details" class="w-full max-w-lg hidden-section fade-in">
            <div class="glass-panel p-10 rounded-3xl">
                <h2 class="text-3xl font-bold mb-6">Verification</h2>
                <form onsubmit="app.saveVoterDetails(event)" class="space-y-6">
                    <input type="text" id="voter-id" required class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white" placeholder="Voter ID">
                    <input type="number" id="voter-ad" required class="w-full bg-black/40 border border-white/10 rounded-xl p-4 text-white" placeholder="Admission Number">
                    <button type="submit" class="w-full bg-blue-600 py-4 rounded-xl font-black">VERIFY</button>
                </form>
            </div>
        </section>

        <!-- 4. VOTING -->
        <section id="page-voting" class="w-full max-w-6xl hidden-section fade-in">
            <div id="ballot-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>

        <!-- 5. PRE-RESULTS -->
        <section id="page-pre-results" class="w-full max-w-3xl hidden-section fade-in">
            <div class="glass-panel p-12 rounded-[40px] text-center">
                <h1 class="text-5xl font-black mb-12 italic">TABULATION READY</h1>
                <button onclick="app.startPresentation()" class="px-12 py-5 bg-white text-black font-black text-xl rounded-2xl">REVEAL LIVE RESULTS</button>
            </div>
        </section>

        <!-- 6. ANALYTICS -->
        <section id="page-results" class="w-full max-w-7xl hidden-section fade-in pb-20 relative">
            <!-- 20-SEC LOADER LAYER -->
            <div id="result-loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#0f0c29] hidden">
                <div id="loader-overlay" class="absolute inset-0 opacity-20 pointer-events-none"></div>
                <div class="relative mb-12">
                    <div class="w-48 h-48 border-2 border-white/5 rounded-full animate-spin-slow"></div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <i class="fa-solid fa-atom text-5xl text-brand-purple animate-pulse"></i>
                    </div>
                </div>
                <div class="text-center space-y-4 max-w-lg px-6">
                    <h2 class="text-4xl font-black tracking-widest uppercase italic">PROCESSING BALLOTS</h2>
                    <p class="text-brand-purple font-mono text-sm" id="loader-status">Verifying Ledger...</p>
                    <div class="w-full h-1.5 bg-white/10 rounded-full mt-8 overflow-hidden">
                        <div id="loader-bar" class="h-full bg-gradient-to-r from-brand-purple to-brand-pink transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD UI -->
            <div class="mb-12 flex justify-between items-end border-b border-white/10 pb-8">
                <div>
                    <h2 class="text-5xl font-black text-white">Election Intelligence</h2>
                    <p id="synthesis-tag" class="text-brand-purple text-xs font-bold uppercase tracking-widest mt-2 hidden animate-pulse">Neural Synthesis Active...</p>
                </div>
                <div class="bg-white/5 p-6 rounded-2xl border border-white/10 min-w-[200px]">
                    <span class="text-gray-400 text-xs font-bold uppercase">Total Cast</span>
                    <div class="text-4xl font-black text-white" id="total-votes-display">0</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 glass-panel p-8 rounded-3xl min-h-[400px]">
                    <canvas id="voteChart"></canvas>
                </div>
                <div id="stats-cards-container" class="space-y-4"></div>
            </div>
            
            <div class="glass-panel rounded-3xl overflow-hidden mt-12">
                <div class="p-8 border-b border-white/10">
                    <h3 class="text-xl font-bold">Audit Registry</h3>
                </div>
                <table class="w-full text-left">
                    <tbody id="voter-table-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal Success -->
    <div id="modal-success" class="fixed inset-0 z-[200] flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-xl" onclick="app.closeModal()"></div>
        <div class="relative glass-panel p-12 rounded-[40px] text-center max-w-sm w-full">
            <i class="fa-solid fa-circle-check text-6xl text-green-500 mb-6"></i>
            <h3 class="text-2xl font-black text-white mb-8">BALLOT ENCRYPTED</h3>
            <button onclick="app.closeModal()" class="w-full bg-green-600 text-white font-black py-4 rounded-xl">FINISH</button>
        </div>
    </div>

    <script>
        const app = {
            candidates: [
                { id: 'sinan', name: 'Sinan K', icon: 'fa-fire-extinguisher', symbol: 'Gas Cylinder', color: '#ef4444' },
                { id: 'jalal', name: 'Jalal', icon: 'fa-mobile-screen-button', symbol: 'Mobile Phone', color: '#3b82f6' },
                { id: 'rayyan', name: 'Rayyan', icon: 'fa-futbol', symbol: 'Football', color: '#10b981' },
                { id: 'ameer', name: 'Ameer Ali', icon: 'fa-cube', symbol: "Rubik's Cube", color: '#f59e0b' }
            ],
            currentVoter: null,
            chartInstance: null,

            init: function() {
                this.checkLoginStatus();
                this.renderCandidates();
                this.initChart();
            },

            navigate: function(pageId) {
                if (!localStorage.getItem('linguo_auth') && pageId !== 'login') {
                    this.showSection('login');
                    return;
                }
                this.showSection(pageId);
                const nav = document.getElementById('navbar');
                if (pageId === 'login') nav.classList.add('hidden-section');
                else nav.classList.remove('hidden-section');
            },

            showSection: function(id) {
                document.querySelectorAll('section').forEach(el => el.classList.add('hidden-section'));
                const target = document.getElementById('page-' + id);
                if(target) target.classList.remove('hidden-section'), target.classList.add('fade-in');
            },

            handleLogin: function(e) {
                e.preventDefault();
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;
                if (u === 'alfalahdnic' && p === '633913') {
                    localStorage.setItem('linguo_auth', 'true');
                    this.navigate('intro');
                } else document.getElementById('login-error').classList.remove('hidden');
            },

            logout: function() { localStorage.removeItem('linguo_auth'); this.navigate('login'); },
            checkLoginStatus: function() { localStorage.getItem('linguo_auth') ? this.navigate('intro') : this.navigate('login'); },

            saveVoterDetails: function(e) {
                e.preventDefault();
                this.currentVoter = { id: document.getElementById('voter-id').value, ad: document.getElementById('voter-ad').value };
                this.navigate('voting');
            },

            renderCandidates: function() {
                const container = document.getElementById('ballot-container');
                container.innerHTML = this.candidates.map(c => `
                    <div class="glass-card rounded-[32px] p-8 text-center">
                        <div class="w-24 h-24 rounded-3xl bg-white/5 flex items-center justify-center mx-auto mb-6 border border-white/10">
                            <i class="${c.icon} text-4xl"></i>
                        </div>
                        <h3 class="text-xl font-black mb-1">${c.name}</h3>
                        <p class="text-xs text-gray-500 uppercase font-bold mb-8">${c.symbol}</p>
                        <button onclick="app.vote('${c.id}')" class="w-full bg-white text-black font-black py-4 rounded-2xl active:scale-95 transition-all">SELECT</button>
                    </div>
                `).join('');
            },

            vote: function(candidateId) {
                if (!this.currentVoter) return this.navigate('voter-details');
                let votes = JSON.parse(localStorage.getItem('linguo_votes')) || {};
                let registry = JSON.parse(localStorage.getItem('linguo_registry')) || [];
                votes[candidateId] = (votes[candidateId] || 0) + 1;
                registry.push({ voterId: this.currentVoter.id, adNo: this.currentVoter.ad, timestamp: new Date().toISOString() });
                localStorage.setItem('linguo_votes', JSON.stringify(votes));
                localStorage.setItem('linguo_registry', JSON.stringify(registry));
                this.currentVoter = null;
                document.getElementById('modal-success').classList.remove('hidden');
            },

            closeModal: function() { document.getElementById('modal-success').classList.add('hidden'); this.navigate('intro'); },

            initChart: function() {
                const ctx = document.getElementById('voteChart').getContext('2d');
                this.chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: this.candidates.map(c => c.name),
                        datasets: [{ data: [0,0,0,0], backgroundColor: this.candidates.map(c => c.color), borderRadius: 10 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { display: false }, x: { ticks: { color: '#64748b', font: { weight: 'bold' } }, grid: { display: false } } }
                    }
                });
            },

            startPresentation: function() {
                this.navigate('results');
                const loader = document.getElementById('result-loader');
                const bar = document.getElementById('loader-bar');
                const status = document.getElementById('loader-status');
                const synthTag = document.getElementById('synthesis-tag');
                
                loader.classList.remove('hidden');
                
                const STAGE_1_TIME = 20000;
                const STAGE_2_TIME = 10000;
                const startTime = Date.now();

                const msgs = ["Decrypting nodes...", "Hashing ballots...", "Syncing ledger...", "Validating..."];

                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    
                    if (elapsed < STAGE_1_TIME) {
                        // PHASE 1: FULL SCREEN LOADER
                        const progress = (elapsed / STAGE_1_TIME) * 100;
                        bar.style.width = progress + '%';
                        status.innerText = msgs[Math.floor((elapsed/STAGE_1_TIME) * msgs.length)];
                    } 
                    else if (elapsed < (STAGE_1_TIME + STAGE_2_TIME)) {
                        // PHASE 2: LIVE SYNTHESIS ON DASHBOARD
                        if (!loader.classList.contains('hidden')) {
                            loader.classList.add('hidden');
                            synthTag.classList.remove('hidden');
                        }

                        // Fluctuating Random Data
                        const mockVotes = {};
                        this.candidates.forEach(c => mockVotes[c.id] = Math.floor(Math.random() * 99));
                        const mockTotal = Object.values(mockVotes).reduce((a,b) => a+b, 0);
                        
                        this.updateDashboard(mockVotes, mockTotal, true);
                    } 
                    else {
                        // FINAL: LOCK IN REAL RESULTS
                        clearInterval(interval);
                        synthTag.classList.add('hidden');
                        const realVotes = JSON.parse(localStorage.getItem('linguo_votes')) || {};
                        const realTotal = Object.values(realVotes).reduce((a,b) => a+b, 0);
                        this.updateDashboard(realVotes, realTotal, false);
                        this.renderRegistry();
                    }
                }, 80);
            },

            updateDashboard: function(votes, total, isMock) {
                // Update Numbers
                document.getElementById('total-votes-display').innerText = total;

                // Update Chart
                this.chartInstance.data.datasets[0].data = this.candidates.map(c => votes[c.id] || 0);
                this.chartInstance.update(isMock ? 'none' : 'default');

                // Update Cards
                const container = document.getElementById('stats-cards-container');
                container.innerHTML = this.candidates
                    .map(c => ({...c, val: votes[c.id] || 0}))
                    .sort((a,b) => b.val - a.val)
                    .map(c => `
                        <div class="glass-card p-4 rounded-xl flex justify-between items-center ${isMock ? 'animate-pulse' : ''}">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center"><i class="${c.icon} text-sm"></i></div>
                                <span class="font-bold text-sm">${c.name}</span>
                            </div>
                            <span class="text-xl font-black" style="color: ${c.color}">${c.val}</span>
                        </div>
                    `).join('');
            },

            renderRegistry: function() {
                const registry = JSON.parse(localStorage.getItem('linguo_registry')) || [];
                document.getElementById('voter-table-body').innerHTML = registry.slice().reverse().map(r => `
                    <tr class="text-xs text-gray-400">
                        <td class="p-6">${new Date(r.timestamp).toLocaleTimeString()}</td>
                        <td class="p-6 font-mono opacity-50">NODE_${Math.random().toString(36).substr(2, 5).toUpperCase()}</td>
                        <td class="p-6 font-bold text-white">${r.adNo}</td>
                        <td class="p-6 text-green-500 font-bold tracking-widest uppercase">Verified</td>
                    </tr>
                `).join('');
            },

            clearData: function() { if(confirm("Reset?")) { localStorage.clear(); location.reload(); } }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
